\* Keep liveness checking small: this configuration still exercises a producer
\* crash, replicator restart, metadata duplication, and mirror fallback.
CONSTANTS
  Producers = {p1}
  Records = {r1}

SPECIFICATION Spec

INVARIANTS
  TypeOK
  MetadataAfterHomeDurable
  NoMirrorOrphanDelivered
  NoMirrorDuplicateDelivered
  MirrorFollowsHomeOrder

PROPERTY
  MetadataLiveness
  MirrorReaderLiveness

CHECK_DEADLOCK FALSE
